name: Check scanner and validation
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py scanner.py validation.py test_validation.py market_backtest.py collect_market_data.py discover_patterns.py test_research.py
      - name: Run deterministic validation tests
        run: python -m unittest -v test_validation test_research
