name: Background multi-market scan
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7,19 * * 1-5'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install pandas numpy yfinance
      - name: Scan stocks, crypto and commodities
        run: python background_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: background-market-scan
          path: background_results/
          retention-days: 14
