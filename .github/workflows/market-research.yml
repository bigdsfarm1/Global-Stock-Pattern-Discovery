name: Free market data and 5 percent pattern research
on:
  workflow_dispatch:
  schedule:
    - cron: "35 20 * * 1-5"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download bounded historical Yahoo data
        run: python collect_market_data.py --max-symbols 30
      - name: Study 5, 10, 20 and 50 percent price rises
        run: python discover_patterns.py
      - name: Save datasets and research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-pattern-research
          path: |
            research_data/
            research_results/
          retention-days: 30
          if-no-files-found: warn
